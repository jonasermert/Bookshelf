name: Bookshelf prüfen
on:
  push:
    branches: [master, codex/react-tailwind]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  frontend:
    name: React testen und bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/dist
  backend:
    name: Spring und Gesamtanwendung prüfen
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: react-build
          path: frontend/dist
      - run: bash mvnw -B verify
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruefprotokolle
          path: |
            target/smoke.log
            target/surefire-reports
